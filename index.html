<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e0e7ff;
            text-align: center;
            padding: 80px 20px;
        }

        .container {
            background: white;
            max-width: 300px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px #aaa;
        }

        h1 {
            color: #4f46e5;
        }

        p {
            color: #555;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #312e81;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>My Website</h1>
        <p>Welcome to my first website!</p>
        <button onclick="alert('Hello World!')">
            Click Me
        </button>
    </div>

</body>
</html>

    
</body>
</html>
